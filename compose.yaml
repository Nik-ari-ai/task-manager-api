services:
    database:
        image: postgres:16-alpine
        container_name: task_manager_database
        environment:
            POSTGRES_DB: task_manager
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5432:5432"
        volumes:
            - database_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d task_manager"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - task_manager_network

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: task_manager_php
        depends_on:
            database:
                condition: service_healthy
        environment:
            APP_ENV: dev
            DATABASE_URL: "postgresql://app:app@database:5432/task_manager?serverVersion=16&charset=utf8"
        volumes:
            - ./:/var/www/app
        networks:
            - task_manager_network

    nginx:
        image: nginx:1.27-alpine
        container_name: task_manager_nginx
        depends_on:
            - php
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/app
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - task_manager_network

volumes:
    database_data:

networks:
    task_manager_network:
